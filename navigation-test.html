<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Raven Course Navigation Test</title><style>body{background:#101014;color:white;font:17px system-ui;margin:0;padding:24px;max-width:680px}h1{color:#ff842f}button{background:#ff842f;color:#141414;border:0;border-radius:12px;padding:17px;margin:8px 8px 8px 0;font-weight:800}button:disabled{opacity:.35}section{border:1px solid #555;border-radius:16px;padding:20px;margin-top:20px}small{color:#bbb}</style></head><body><h1>🐦‍⬛ RAVEN / Navigation Test</h1><p>Public demo only. No paid lessons included.</p><p id="status">Loading…</p><section><h2 id="heading">Mission 1</h2><p id="body">Tap Complete Mission to unlock Mission 2.</p><button id="complete">Complete Mission</button><button id="next" disabled>Next →</button><button id="back" disabled>← Back</button><button id="reset">Reset Test</button></section><small id="storage"></small><script>let step=0,unlocked=0;try{unlocked=Number(localStorage.getItem('raven-demo-unlocked')||0)}catch(e){}function draw(){document.getElementById('heading').textContent='Mission '+(step+1);document.getElementById('body').textContent=step===0?'Tap Complete Mission to unlock Mission 2.':'Success! You reached Mission 2.';document.getElementById('next').disabled=step>=1||unlocked<1;document.getElementById('back').disabled=step===0;document.getElementById('complete').disabled=step===1;document.getElementById('status').textContent='JavaScript running • Mission '+(step+1)+' • unlocked '+(unlocked+1)+'/2';}document.getElementById('complete').onclick=()=>{unlocked=1;try{localStorage.setItem('raven-demo-unlocked','1');document.getElementById('storage').textContent='Progress saved in browser.'}catch(e){document.getElementById('storage').textContent='Storage unavailable; navigation still works.'}draw()};document.getElementById('next').onclick=()=>{step=1;draw()};document.getElementById('back').onclick=()=>{step=0;draw()};document.getElementById('reset').onclick=()=>{step=0;unlocked=0;try{localStorage.removeItem('raven-demo-unlocked')}catch(e){}draw()};draw();</script></body></html>
